<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body>
    <div class="wrapper">
        <header th:replace="~{_frag/base::site-header}"></header>
        <aside>
            <div th:replace="~{_frag/base::site-menu}"></div>
            <button id="usuarios" class="boton-menu boton"><i class="bi bi-person-square"></i><a th:href="@{/admin/index}" style="color: inherit; text-decoration: none;">Usuario</a></button>
            <nav>
                <ul class="menu">
                    <li><button id="productos" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i><a th:href="@{/producto/index}" style="color: inherit; text-decoration: none;">Productos</a></button></li>
                    <li><button id="clientes" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i><a th:href="@{/cliente/index}" style="color: inherit; text-decoration: none;">Clientes</a></button></li>
                    <li><button id="proveedores" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i><a th:href="@{/proveedor/index}" style="color: inherit; text-decoration: none;">Proveedores</a></button></li>
                    <li><button id="empleados" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i><a th:href="@{/empleado/index}" style="color: inherit; text-decoration: none;">Empleados</a></button></li>
                    <li><button id="compras" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i><a th:href="@{/compra/index}" style="color: inherit; text-decoration: none;">Compras</a></button></li>
                </ul>
            </nav>
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" id="logoutForm">
                    <p class="text-white align-middle m-0">
                        <button id="usuarios" class="boton-menu boton"><i class="bi bi-door-closed-fill"></i> Cerrar Sesión</button>
                    </p>
                </form>
            </div>
            <footer th:replace="~{_frag/base::site-footer}"></footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Lista de Compras</h2>
            <div class="button-group" style="margin-bottom: 20px;">
                <button type="button" class="btn btn-secondary bi bi-plus-square" onclick="location.href='/compra/nuevo'">   Agregar Compra</button>
                <button type="button" class="btn btn-danger bi bi-x-square" onclick="location.href='/'">   Cerrar</button>
            </div>
            <table id="listadoCompra" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Proveedor</th>
                        <th>Empleado</th>
                        <th>Fecha</th>
                        <th>Ver</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider">
                    <tr th:each="compra : ${listaCompras}">
                        <td th:text="${compra.id}">ID</td>
                        <td th:text="${compra.proveedor.ruc}">Proveedor</td>
                        <td th:text="${compra.empleado.nombres}">Empleado</td>
                        <td th:text="${#dates.format(compra.fecha, 'yyyy-MM-dd')}">Fecha</td>
                        <td>
                            <button type="button" class="btn btn-info">
                                <a th:href="@{/compra/ver/{id}(id=${compra.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-eye"></i></a>
                            </button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-success">
                                <a th:href="@{/compra/editar/{id}(id=${compra.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-pencil-square"></i></a>
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/compra/eliminar/{id}(id=${compra.id})}" method="post" onsubmit="return confirm('¿Eliminar compra?')">
                                <button type="submit" class="btn btn-warning" aria-label="Eliminar compra"><i class="bi bi-trash3"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    <div th:replace="~{_frag/base::site-scripts}"></div>
</body>
</html>
