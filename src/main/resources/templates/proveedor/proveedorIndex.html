<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-app">
    <div class="wrapper">
        <header th:replace="~{_frag/base::site-header}"></header>
        <aside th:replace="~{_frag/navbar::m_navbar}"></aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Proveedores</h2>

            <div class="button-group" style="margin-bottom: 20px;">
                <a class="btn btn-primary" th:href="@{/proveedor/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo proveedor</a>
            </div>

            <table id="listadoProveedor" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th>RUC</th>
                        <th>Razón Social</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider">
                    <tr th:each="proveedor : ${listaProveedores}">
                        <td th:text="${proveedor.ruc}">RUC</td>
                        <td th:text="${proveedor.razonSocial}">Razón Social</td>
                        <td th:text="${proveedor.telefono}">Teléfono</td>
                        <td th:text="${proveedor.direccion}">Dirección</td>
                        <td>
                            <button type="button" class="btn btn-success">
                                <a th:href="@{/proveedor/editar/{id}(id=${proveedor.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-pencil-square"></i></a>
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/proveedor/eliminar/{id}(id=${proveedor.id})}" method="post" onsubmit="return confirm('¿Eliminar proveedor?')">
                                <button type="submit" class="btn btn-warning" aria-label="Eliminar proveedor"><i class="bi bi-trash3"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    
    <div th:replace="~{_frag/base::site-scripts}"></div>
</body>
</html>
