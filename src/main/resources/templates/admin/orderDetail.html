<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-app">
<div class="wrapper">
    <header th:replace="~{_frag/base::site-header}"></header>
    <aside th:replace="~{_frag/navbar::m_navbar}"></aside>
    <main>
        <a th:href="@{/admin/pedidos}">← Volver a pedidos</a>
        <h1 class="titulo-principal">Detalle del pedido</h1>
        <dl>
            <dt>Número</dt><dd th:text="${order.id}">ID</dd>
            <dt>Estado</dt><dd th:text="${order.status}">Estado</dd>
            <dt>Creado</dt><dd th:text="${order.createdAt}">Fecha</dd>
            <dt>Confirmado</dt><dd th:text="${order.paidAt ?: '—'}">Fecha</dd>
            <dt>Comprador</dt><dd th:text="${order.customerEmail ?: '—'}">Correo</dd>
        </dl>
        <table class="table table-striped">
            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr></thead>
            <tbody>
                <tr th:each="line : ${order.lines}">
                    <td th:text="${line.name}">Producto</td>
                    <td th:text="${line.quantity}">1</td>
                    <td th:text="|S/ ${#numbers.formatDecimal(line.unitAmount / 100.0, 1, 2)}|">S/ 0.00</td>
                    <td th:text="|S/ ${#numbers.formatDecimal(line.subtotal / 100.0, 1, 2)}|">S/ 0.00</td>
                </tr>
            </tbody>
        </table>
        <p><strong>Total: </strong><span th:text="|S/ ${#numbers.formatDecimal(order.totalAmount / 100.0, 1, 2)}|">S/ 0.00</span></p>
    </main>
</div>
<div th:replace="~{_frag/base::site-scripts}"></div>
</body>
</html>
