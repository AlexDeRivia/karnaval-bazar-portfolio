<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-app">
    <div class="wrapper">
        <header th:replace="~{_frag/base::site-header}"></header>
        <aside th:replace="~{_frag/navbar::m_navbar}"></aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Clientes</h2>

            <div class="button-group" style="margin-bottom: 20px;">
                <a class="btn btn-primary" th:href="@{/cliente/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo cliente</a>
            </div>

            <table id="listadoCliente" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Apellido Paterno</th>
                        <th>Apellido Materno</th>
                        <th>Nombres</th>
                        <th>Fecha de Nacimiento</th>
                        <th>Celular</th>
                        <th>eMail</th>
                        <th>Dirección</th>
                        <th>Género</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider">
                    <tr th:each="cliente : ${listaClientes}">
                        <td th:text="${cliente.dni}">DNI</td>
                        <td th:text="${cliente.apellidoPaterno}">Apellido Paterno</td>
                        <td th:text="${cliente.apellidoMaterno}">Apellido Materno</td>
                        <td th:text="${cliente.nombres}">Nombres</td>
                        <td th:text="${#dates.format(cliente.fechaNacimiento, 'dd/MM/yyyy')}">Fecha de Nacimiento</td>
                        <td th:text="${cliente.celular}">Celular</td>
                        <td th:text="${cliente.eMail}">eMail</td>
                        <td th:text="${cliente.direccion}">Dirección</td>
                        <td th:text="${cliente.genero}">Género</td>
                        <td>
                            <button type="button" class="btn btn-success">
                                <a th:href="@{/cliente/editar/{id}(id=${cliente.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-pencil-square"></i></a>
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/cliente/eliminar/{id}(id=${cliente.id})}" method="post" onsubmit="return confirm('¿Eliminar cliente?')">
                                <button type="submit" class="btn btn-warning" aria-label="Eliminar cliente"><i class="bi bi-trash3"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
