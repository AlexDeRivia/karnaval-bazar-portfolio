<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-login">
    <header class="header-mobile"><a class="logo" th:href="@{/}">Bazar Central</a></header>
    <main class="management-login-main">
        <section class="management-login-card" aria-labelledby="login-title">
            <span class="preview-eyebrow">ACCESO ADMINISTRATIVO</span>
            <h1 id="login-title">Bienvenido de nuevo.</h1>
            <p>Ingresa con las credenciales del equipo para administrar el bazar.</p>
            <p th:if="${param.error}" class="alert alert-danger" role="alert">Usuario o contraseña incorrectos.</p>
            <form th:action="@{/login}" method="post">
                <div class="field"><label for="inputUsername">Usuario</label><input id="inputUsername" type="text" name="username" autocomplete="username" required autofocus></div>
                <div class="field"><label for="inputPassword">Contraseña</label><input id="inputPassword" type="password" name="password" autocomplete="current-password" required></div>
                <button type="submit">Ingresar</button>
            </form>
            <a class="back-link" th:href="@{/gestion}">← Volver a la vista de consulta</a>
        </section>
    </main>
</body>
</html>
