<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-app">
    <div class="wrapper">
        <header th:replace="~{_frag/base::site-header}"></header>
        <aside th:replace="~{_frag/navbar::m_navbar}"></aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Productos</h2>

            <div class="button-group" style="margin-bottom: 20px;">
                <a class="btn btn-primary" th:href="@{/producto/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo producto</a>
            </div>

            <table id="listadoProducto" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Descripción</th>
                        <th>Ubicación en Almacén</th>
                        <th>Foto</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider">
                    <tr th:each="producto : ${listaProductos}">
                        <td th:text="${producto.nombre}">Nombre</td>
                        <td th:text="${producto.precio}">Precio</td>
                        <td th:text="${producto.stock}">Stock</td>
                        <td th:text="${producto.descripcion}">Descripción</td>
                        <td th:text="${producto.ubicacionAlmacen}">Ubicación en Almacén</td>
                        <td><img th:src="@{${producto.foto}}" alt="Foto del producto" width="50" height="50"></td>
                        <td>
                            <button type="button" class="btn btn-success">
                                <a th:href="@{/producto/editar/{id}(id=${producto.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-pencil-square"></i></a>
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/producto/eliminar/{id}(id=${producto.id})}" method="post" onsubmit="return confirm('¿Eliminar producto?')">
                                <button type="submit" class="btn btn-warning" aria-label="Eliminar producto"><i class="bi bi-trash3"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    
    <div th:replace="~{_frag/base::site-scripts}"></div>
</body>
</html>
