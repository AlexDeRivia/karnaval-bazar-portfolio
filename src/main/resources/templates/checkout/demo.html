<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="checkout-page">
    <main class="checkout-card">
        <p class="demo-badge">Resumen de prueba · ningún pago realizado</p>
        <h1>Resumen de compra</h1>
        <p>Este recorrido muestra la preparación del pedido. No se ha cobrado ni registrado una venta real.</p>
        <ul>
            <li th:each="line : ${lines}">
                <span th:text="${line.producto.nombre}">Producto</span>
                <span th:text="${line.quantity}">1</span>
            </li>
        </ul>
        <p class="checkout-total">Total simulado: S/ <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></p>
        <a class="btn btn-primary" th:href="@{/}">Volver al catálogo</a>
    </main>
    <script>localStorage.removeItem('productos-en-carrito');</script>
</body>
</html>
