<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/base::site-head}"></head>
<body class="management-app">
    <div class="wrapper">
        <header th:replace="~{_frag/base::site-header}"></header>
        <aside th:replace="~{_frag/navbar::m_navbar}"></aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Empleados</h2>

            <div class="button-group" style="margin-bottom: 20px;">
                <a class="btn btn-primary" th:href="@{/empleado/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo empleado</a>
            </div>

            <table id="listadoEmpleado" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Apellido Paterno</th>
                        <th>Apellido Materno</th>
                        <th>Nombres</th>
                        <th>Fecha de Nacimiento</th>
                        <th>Celular</th>
                        <th>eMail</th>
                        <th>Dirección</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider">
                    <tr th:each="empleado : ${listaEmpleados}">
                        <td th:text="${empleado.dni}">DNI</td>
                        <td th:text="${empleado.apellidoPaterno}">Apellido Paterno</td>
                        <td th:text="${empleado.apellidoMaterno}">Apellido Materno</td>
                        <td th:text="${empleado.nombres}">Nombres</td>
                        <td th:text="${#dates.format(empleado.fechaNacimiento, 'yyyy-MM-dd')}">Fecha de Nacimiento</td>
                        <td th:text="${empleado.celular}">Celular</td>
                        <td th:text="${empleado.eMail}">eMail</td>
                        <td th:text="${empleado.direccion}">Dirección</td>
                        <td>
                            <button type="button" class="btn btn-success">
                                <a th:href="@{/empleado/editar/{id}(id=${empleado.id})}" style="color: inherit; text-decoration: none;"><i class="bi bi-pencil-square"></i></a>
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/empleado/eliminar/{id}(id=${empleado.id})}" method="post" onsubmit="return confirm('¿Eliminar empleado?')">
                                <button type="submit" class="btn btn-warning" aria-label="Eliminar empleado"><i class="bi bi-trash3"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    
    <div th:replace="~{_frag/base::site-scripts}"></div>
</body>
</html>
