<head th:fragment="site-head">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Lumbre</title>
    <link rel="icon" type="image/png" sizes="64x64" th:href="@{/favicon.png}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<header class="header-mobile" th:fragment="site-header">
	<h1 class="logo">Casa Lumbre</h1>
	<button class="open-menu" id="open-menu">
		  	<i class="bi bi-list"></i>
	</button>
</header>

<div th:fragment = "site-menu"> 
	<button class="close-menu" id="close-menu">
	    <i class="bi bi-x"></i>
	</button>
	<header>
	    <h1 class="logo">Casa Lumbre</h1>
	</header>
</div>

<footer th:fragment = "site-footer">
	<p class="texto-footer">© 2024 Casa Lumbre</p>
</footer>

<div th:fragment = "site-scripts"> 
	<script th:src="@{/js/menu.js}"></script>
</div>
