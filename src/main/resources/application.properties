spring.application.name=BazarCentral
spring.profiles.default=demo
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never

# No administrator account is created unless both values are supplied.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed.catalog=${APP_SEED_CATALOG:false}

# Only test-mode Stripe credentials are accepted by the checkout.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.public-base-url=${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
