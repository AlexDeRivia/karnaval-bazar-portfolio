spring.application.name=KarnavalBazaar
spring.profiles.default=demo
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never

# No administrator account is created unless both values are supplied.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Stripe is opt-in and never used by the public demo profile.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.public-base-url=${PUBLIC_BASE_URL:}
